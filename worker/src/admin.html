<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Медтести — правки</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2430; --muted:#667085; --line:#e3e6eb; --accent:#0f766e; --ok:#15803d; --ok-soft:#e7f6ec; --bad:#b42318; --bad-soft:#fdecea; --sel-soft:#e8eefc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161c; --card:#1b2129; --text:#e6e9ee; --muted:#98a2b3; --line:#2c343f; --accent:#2dd4bf; --ok:#4ade80; --ok-soft:#16301f; --bad:#f87171; --bad-soft:#3a1d1c; --sel-soft:#1d2a47; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:820px; margin:0 auto; padding:16px 16px 60px; }
  h1 { font-size:22px; margin:8px 0 16px; }
  .card { background:var(--card); border-radius:14px; padding:16px; box-shadow:0 0 0 1px var(--line) inset; margin-bottom:12px; }
  .muted { color:var(--muted); font-size:13px; }
  .q { font-weight:600; margin:4px 0 10px; }
  .opt { display:flex; gap:10px; padding:8px 10px; border-radius:10px; margin-bottom:6px; box-shadow:0 0 0 1px var(--line) inset; }
  .opt b { flex:none; width:18px; }
  .opt.current { background:var(--ok-soft); box-shadow:0 0 0 2px var(--ok) inset; }
  .comments { margin:10px 0; padding:0; list-style:none; }
  .comments li { padding:6px 0; border-top:1px solid var(--line); font-size:14px; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  button { font:inherit; border:0; border-radius:10px; padding:9px 14px; cursor:pointer; background:var(--card); color:var(--text); box-shadow:0 0 0 1px var(--line) inset; }
  button.accept { background:var(--accent); color:#fff; box-shadow:none; }
  @media (prefers-color-scheme: dark) { button.accept { color:#062420; } }
  button.reject { color:var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  input { font:inherit; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); width:100%; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tabs button.on { background:var(--accent); color:#fff; box-shadow:none; }
  .tag { display:inline-block; padding:1px 8px; border-radius:6px; font-size:12px; font-weight:600; }
  .tag.accepted { background:var(--ok-soft); color:var(--ok); }
  .tag.rejected { background:var(--bad-soft); color:var(--bad); }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
  .err { color:var(--bad); }
</style>
</head>
<body>
<main id="root"></main>
<script>
const APP_URL = '__APP_URL__';
const root = document.getElementById('root');
let token = '';
try { token = localStorage.getItem('adminToken') || ''; } catch {}
let tab = 'pending';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
const cats = {};
const fmt = (letters) => (letters ? [...letters].join(', ') : '—');

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { logout(); throw new Error('Невірний пароль'); }
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

async function category(id) {
  if (!cats[id]) {
    cats[id] = fetch(`${APP_URL}data/uk/${id}.json`, { cache: 'no-cache' }).then((r) => r.json()).catch(() => null);
  }
  return cats[id];
}

function login(msg = '') {
  root.innerHTML = `<h1>Правки відповідей</h1>
    <form class="card" id="login">
      <p>Пароль адміністратора:</p>
      <input type="password" id="pw" autocomplete="current-password">
      <div class="actions"><button class="accept">Увійти</button></div>
      ${msg ? `<p class="err">${esc(msg)}</p>` : ''}
    </form>`;
  document.getElementById('login').onsubmit = (e) => {
    e.preventDefault();
    token = document.getElementById('pw').value.trim();
    try { localStorage.setItem('adminToken', token); } catch {}
    render();
  };
}
function logout() {
  token = '';
  try { localStorage.removeItem('adminToken'); } catch {}
}

async function render() {
  if (!token) return login();
  root.innerHTML = `<h1>Правки відповідей</h1><div class="empty">Завантаження…</div>`;
  let rows;
  try {
    rows = (await api(`/api/admin/suggestions?status=${tab}`)).suggestions;
  } catch (e) {
    return token ? (root.innerHTML = `<h1>Правки відповідей</h1><p class="err">${esc(e.message)}</p>`) : login(e.message);
  }
  const tabs = `<div class="tabs">
    <button data-tab="pending" class="${tab === 'pending' ? 'on' : ''}">Нові</button>
    <button data-tab="done" class="${tab === 'done' ? 'on' : ''}">Історія</button>
    <button data-logout style="margin-left:auto">Вийти</button></div>`;
  root.innerHTML = `<h1>Правки відповідей</h1>${tabs}<div id="list"></div>`;
  const list = document.getElementById('list');
  if (!rows.length) { list.innerHTML = `<div class="empty">${tab === 'pending' ? 'Нових правок немає' : 'Поки порожньо'}</div>`; return; }
  tab === 'pending' ? await renderPending(list, rows) : await renderHistory(list, rows);
}

async function renderPending(list, rows) {
  const groups = new Map();
  for (const r of rows) {
    const k = `${r.cat}:${r.n}`;
    if (!groups.has(k)) groups.set(k, { cat: r.cat, n: r.n, items: [] });
    groups.get(k).items.push(r);
  }
  const html = [];
  for (const g of groups.values()) {
    const data = await category(g.cat);
    const q = data?.questions.find((x) => x.n === g.n);
    const current = (q?.correct || []).join('');
    const votes = {};
    for (const r of g.items) votes[r.letter] = (votes[r.letter] || 0) + 1;
    const letters = Object.keys(votes).sort((a, b) => votes[b] - votes[a]);
    html.push(`<div class="card">
      <div class="muted">${esc(data?.title || `Категорія ${g.cat}`)} · № ${g.n} · поточна відповідь: <b>${esc(current || '—')}</b></div>
      <div class="q">${esc(q?.text || '')}</div>
      ${(q?.options || []).map((o) => `<div class="opt ${current.includes(o.id) ? 'current' : ''}">
        <b>${o.id}</b><span>${esc(o.text)}</span></div>`).join('')}
      <div class="muted">Голоси: ${letters.map((l) => `<b>${fmt(l)}</b> — ${votes[l]}`).join(' · ')}</div>
      <ul class="comments">${g.items.map((r) => `<li><b>${esc(fmt(r.letter))}</b> · ${esc(r.name || 'анонім')} · <span class="muted">${new Date(r.created_at).toLocaleString('uk')}</span>${r.comment ? `<br>${esc(r.comment)}` : ''}</li>`).join('')}</ul>
      <div class="actions">
        ${letters.filter((l) => l !== current).map((l) => `<button class="accept" data-accept="${l}" data-cat="${g.cat}" data-n="${g.n}">Прийняти «${fmt(l)}»</button>`).join('')}
        <button class="reject" data-reject data-cat="${g.cat}" data-n="${g.n}">Відхилити — залишити «${esc(fmt(current))}»</button>
      </div></div>`);
  }
  list.innerHTML = html.join('');
}

async function renderHistory(list, rows) {
  const html = [];
  for (const r of rows) {
    const data = await category(r.cat);
    html.push(`<div class="card">
      <span class="tag ${r.status}">${r.status === 'accepted' ? 'прийнято' : 'відхилено'}</span>
      <span class="muted">${esc(data?.title || r.cat)} · № ${r.n} · запропоновано «${esc(fmt(r.letter))}» (було «${esc(fmt(r.current))}») · ${esc(r.name || 'анонім')} · ${new Date(r.resolved_at).toLocaleString('uk')}</span>
      ${r.comment ? `<div>${esc(r.comment)}</div>` : ''}</div>`);
  }
  list.innerHTML = html.join('');
}

root.addEventListener('click', async (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.tab) { tab = b.dataset.tab; return render(); }
  if (b.dataset.logout !== undefined) { logout(); return render(); }
  const { cat, n } = b.dataset;
  if (!cat) return;
  const card = b.closest('.card');
  card.querySelectorAll('button').forEach((x) => (x.disabled = true));
  try {
    if (b.dataset.accept) await api('/api/admin/accept', { cat, n: Number(n), letter: b.dataset.accept });
    else await api('/api/admin/reject', { cat, n: Number(n) });
    card.innerHTML = `<div class="muted">${b.dataset.accept ? `Прийнято «${fmt(b.dataset.accept)}». Сайт оновиться за 1–2 хвилини.` : 'Відхилено.'}</div>`;
  } catch (err) {
    card.querySelectorAll('button').forEach((x) => (x.disabled = false));
    alert(err.message);
  }
});

render();
</script>
</body>
</html>
